name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Check for an unpublished version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unpublished: ${{ steps.registry.outputs.unpublished }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the package version with npm
        id: registry
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          PUBLISHED="$(npm view "osrs-wiki-mcp@$VERSION" version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Verify and publish
    needs: release-check
    if: needs.release-check.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository and complete history
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          base: ""
          head: HEAD
          version: "3.95.9"

      - name: Set up Node.js 24 and npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the reviewed npm CLI
        run: npm install --global npm@11.16.0

      - name: Verify the npm CLI version
        run: test "$(npm --version)" = "11.16.0"

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify dependency signatures
        run: npm audit signatures

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Run process-heavy integration contracts serially
        run: node --test --test-concurrency=1 "test/integration/*.test.ts"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Exercise stdio transport
        run: npm run smoke:stdio

      - name: Inspect dry-run package manifest
        run: npm pack --dry-run --json

      - name: Scan and smoke-test the real package tarball
        run: npm run pack:check

      - name: Confirm verification left the checkout clean
        run: git diff --exit-code

      - name: Prepare exact release tarball
        id: release-pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          node scripts/inspect-pack.mjs --artifact-dir "$RUNNER_TEMP/npm-release" --release-sha "${{ github.sha }}"
          TARBALL="$(node -e 'const fs = require("node:fs"); const [entry] = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!entry?.filename) process.exit(1); process.stdout.write(entry.filename);' "$RUNNER_TEMP/npm-release/npm-pack.json")"
          echo "tarball=$RUNNER_TEMP/npm-release/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Upload verified release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.sha }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 7

      - name: Publish the verified tarball
        run: npm publish "${{ steps.release-pack.outputs.tarball }}"
